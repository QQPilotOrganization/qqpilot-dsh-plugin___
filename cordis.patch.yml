# qqpilot-dsh-plugin bundle layer — applied when a profile lists this bundle.
# `name` is this package's name (resolved through the profile node_modules).
#
# Config values below are the defaults; the settings card (Settings → QQPilot)
# writes runtime overrides to ~/.dsh/qqpilot-dsh-plugin.json.
- insert:
    - id: qqpilot-dsh-plugin
      name: qqpilot-dsh-plugin
      config:
        # agent (tools) | compat (return model text directly) | silent (record only)
        mode: agent
        compatibilityMode: false
        # off | safe (read-only + web) | all (minus dshToolDeny)
        dshTools: safe
        # all (multi-user request context) | latest (legacy last-message-only)
        contextMode: all
        # Windows QQPilot DLC helper tools (requires workspaceRoot = QQPilot data dir)
        enableGetChatName: false
        enableUploadFiles: false
